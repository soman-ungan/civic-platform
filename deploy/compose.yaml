#
# 本番の構成（ADR 0001）: backend・frontend・Caddy。値は deploy/.env（deploy/.env.example を写して作る。
# リポジトリに入れない）。イメージは CI が GHCR に置いたものを使う。手元で作るときは --build
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
# 手順は docs/operations/deploy.md

name: civic-platform

services:
  backend:
    image: ghcr.io/soman-ungan/civic-platform-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET を deploy/.env に}
      COOKIE_SECURE: "true"
      WEBAUTHN_RP_ID: ${SITE_DOMAIN:?SITE_DOMAIN を deploy/.env に}
      # 手元で 443 以外のポートで試すときは PUBLIC_ORIGIN（例: https://localhost:8443）
      WEBAUTHN_ORIGIN: ${PUBLIC_ORIGIN:-https://${SITE_DOMAIN}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-}
      TAGGING_MODEL: ${TAGGING_MODEL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-}
      LLM_EXTRACTION_DAILY_BUDGET_USD: ${LLM_EXTRACTION_DAILY_BUDGET_USD:-}
      COLLECTOR_CONTACT: ${COLLECTOR_CONTACT:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - db:/data

  frontend:
    image: ghcr.io/soman-ungan/civic-platform-frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-https://github.com/soman-ungan/civic-platform}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8080
      SITE_OPERATOR_NAME: ${SITE_OPERATOR_NAME:-}
      SITE_FINANCE_REPORT_URL: ${SITE_FINANCE_REPORT_URL:-}
      SITE_JURISDICTION_COURT: ${SITE_JURISDICTION_COURT:-}
      SITE_ACCESS_LOG_RETENTION: ${SITE_ACCESS_LOG_RETENTION:-}
      SITE_HOSTING: ${SITE_HOSTING:-}
      SITE_AI_DATA_HANDLING: ${SITE_AI_DATA_HANDLING:-}
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      BASIC_AUTH: ${BASIC_AUTH:-off}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db:
  caddy_data:
  caddy_config:
