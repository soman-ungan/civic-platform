#
# 本番の構成（ADR 0001）: backend・frontend・Caddy・Litestream。値は deploy/.env（deploy/.env.example を写して作る。
# リポジトリに入れない）。イメージは CI が GHCR に置いたものを使う。手元で作るときは --build
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
# 手順は docs/operations/deploy.md

name: civic-platform

# コンテナのログ（標準出力）が増え続けないように
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/soman-ungan/civic-platform-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET を deploy/.env に}
      COOKIE_SECURE: "true"
      # 接続元の IP は Caddy が付ける X-Forwarded-For から読む（回数の制限）
      TRUST_FORWARDED_FOR: "true"
      WEBAUTHN_RP_ID: ${SITE_DOMAIN:?SITE_DOMAIN を deploy/.env に}
      # 手元で 443 以外のポートで試すときは PUBLIC_ORIGIN（例: https://localhost:8443）
      WEBAUTHN_ORIGIN: ${PUBLIC_ORIGIN:-https://${SITE_DOMAIN}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-}
      TAGGING_MODEL: ${TAGGING_MODEL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-}
      LLM_EXTRACTION_DAILY_BUDGET_USD: ${LLM_EXTRACTION_DAILY_BUDGET_USD:-}
      COLLECTOR_CONTACT: ${COLLECTOR_CONTACT:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - db:/data
    depends_on:
      restore:
        condition: service_completed_successfully

  # 起動の前に1回だけ動く。DB が無いとき（新しいサーバー・ボリュームを消したあと）は、バックアップがあれば戻す。
  # DB があれば何もしない。バックアップがまだ無ければ何もしない（初めてのデプロイ）。
  # R2 の値が間違っていると失敗し、backend は起動しない（空の DB で始めて、バックアップを上書きしないように）
  restore:
    image: litestream/litestream:${LITESTREAM_VERSION:-0.5.17}
    environment: &litestream-env
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_RETENTION: ${LITESTREAM_RETENTION:-168h}
    # 戻したファイルを backend（uid 10001）が書けるように、root で戻してから持ち主を変える
    entrypoint: ["sh", "-c"]
    command:
      - litestream restore -if-db-not-exists -if-replica-exists /data/civic.db && chown -R 10001:10001 /data
    volumes: &litestream-volumes
      - ./litestream.yml:/etc/litestream.yml:ro
      - db:/data

  # SQLite の変更を R2 に常に複製する（1秒ごと。まるごとの写しは1日1回）
  litestream:
    image: litestream/litestream:${LITESTREAM_VERSION:-0.5.17}
    restart: unless-stopped
    logging: *logging
    # backend と同じ持ち主でファイルを作る（-shm など）
    user: "10001:10001"
    command: ["replicate"]
    environment: *litestream-env
    volumes: *litestream-volumes
    depends_on:
      - backend

  frontend:
    image: ghcr.io/soman-ungan/civic-platform-frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-https://github.com/soman-ungan/civic-platform}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_URL: http://backend:8080
      SITE_OPERATOR_NAME: ${SITE_OPERATOR_NAME:-}
      SITE_FINANCE_REPORT_URL: ${SITE_FINANCE_REPORT_URL:-}
      SITE_JURISDICTION_COURT: ${SITE_JURISDICTION_COURT:-}
      SITE_ACCESS_LOG_RETENTION: ${SITE_ACCESS_LOG_RETENTION:-}
      SITE_BACKUP: ${SITE_BACKUP:-}
      SITE_BACKUP_RETENTION: ${SITE_BACKUP_RETENTION:-}
      SITE_HOSTING: ${SITE_HOSTING:-}
      SITE_AI_DATA_HANDLING: ${SITE_AI_DATA_HANDLING:-}
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
      SITE_SOCIAL_LINKS: ${SITE_SOCIAL_LINKS:-}
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      BASIC_AUTH: ${BASIC_AUTH:-off}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
      # アクセスの記録を残す期間（例: 2160h = 90日）。プライバシーポリシーの SITE_ACCESS_LOG_RETENTION と合わせる
      ACCESS_LOG_KEEP: ${ACCESS_LOG_KEEP:-2160h}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db:
  caddy_data:
  caddy_config:
