# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # 本番ビルドでは必須（AGPL 第13条のソースリンク）
      NEXT_PUBLIC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # SQL が PostgreSQL でも動くことを確認する（docs/adr/0001-docker-adoption.md）
  postgres-compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: civic
    steps:
      - uses: actions/checkout@v4
      - name: マイグレーションを適用
        run: |
          for f in backend/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "::endgroup::"
          done
      - name: seed を適用（2回流して冪等性も確認）
        run: |
          for pass in 1 2; do
            for f in data/seeds/*.sql; do
              echo "::group::pass $pass: $f"
              psql -v ON_ERROR_STOP=1 --single-transaction -f "$f"
              echo "::endgroup::"
            done
          done
      - name: 件数を確認
        run: |
          test "$(psql -tAc 'select count(*) from prefectures')" = 47
          test "$(psql -tAc 'select count(*) from municipalities')" -ge 1
