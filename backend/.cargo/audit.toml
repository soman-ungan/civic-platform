# SPDX-License-Identifier: AGPL-3.0-only
# cargo audit の設定（CI の audit ジョブ）

[advisories]
ignore = [
    # rsa の Marvin Attack。sqlx の Cargo.lock には使わないドライバ（sqlx-mysql）も載るため検出されるが、
    # mysql の機能は有効にしておらず、ビルドに入らない（`cargo tree -i rsa --target all` が空）。
    # mysql を使うようにしたら、この除外を外して見直す（2026-10-31）
    "RUSTSEC-2023-0071",
    # libsqlite3-sys（sqlx が同梱する SQLite）の CVE-2026-119375。ページサイズの違う DB と -wal の組を開くと、
    # 初期化していないメモリが読み出される。信頼できない人が書いた DB ファイルと -wal を開くときだけ影響する。
    # backend が開くのは自分の DB（/data/civic.db と、自分のバックアップから戻したもの）だけなので当てはまらない。
    # 直った libsqlite3-sys は 0.39 以上だが、sqlx は 0.8.6・0.9.0 とも 0.37 以下に固定していて上げられない。
    # sqlx が 0.39 以上に対応したら、上げてこの除外を外す（2026-11-09）
    "RUSTSEC-2026-0459",
]
